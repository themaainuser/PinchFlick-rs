[package]
name = "pinchflick-rs"
version = "0.1.0"
edition = "2024"

[patch.crates-io]
# PinchFlick local patch: nokhwa-bindings-windows applies native media
# types whose MF_MT_FRAME_RATE can be 15/1 while RANGE_MAX = 30 (delivery
# capped at 15fps; cv2 paces 17-25 on the same webcam). Vendored copy of
# 0.4.6 with an explicit MF_MT_FRAME_RATE set — see VENDOR-NOTICE.md.
nokhwa-bindings-windows = { path = "third_party/nokhwa-bindings-windows" }

[dependencies]
# M4: the preview/HUD window (design doc section 5). 0.37 = current stable
# (published 2026-10-15); run_native/ViewportBuilder/Painter APIs verified
# against docs.rs 0.37 before wiring.
eframe = "0.37"
image = "0.25.10"
nokhwa = { version = "0.10.11", features = ["input-msmf"] }
ort = "2.0.0-rc.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `selftest::with_config` writes throwaway config files at runtime too
# (was dev-only until the checks moved into the lib for `--selftest`).
tempfile = "3.27.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }
zip = "9.0.3"

